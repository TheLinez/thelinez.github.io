<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheLinez // Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фоновые неоновые туманности -->
    <div class="purple-nebula top-glow"></div>
    <div class="purple-nebula bottom-glow"></div>

    <main class="profile-card">
        <!-- Аватар с неоновой орбитой -->
        <div class="avatar-orbit">
            <img src="avatar.png" alt="TheLinez" class="profile-img">
            <span class="pulse-indicator"></span>
        </div>

        <!-- Инфо Блок -->
        <section class="user-info">
            <h1 class="username">TheLinez</h1>
            <div class="badge-row">
                <span class="badge purple">he</span>
                <span class="badge dark">developer</span>
            </div>
            <p class="console-text">&gt; python --version <span class="cyan-text">3.11</span></p>
        </section>

        <!-- Лента ссылок (Каскадный список вместо сетки) -->
        <nav class="links-stack">
            <a href="https://github.com/TheLinez" class="glass-button" target="_blank">
                <span class="btn-icon">🔮</span>
                <span class="btn-text">GitHub Project Storage</span>
            </a>
            
            <a href="https://steamcommunity.com/profiles/76561199735464471/" class="glass-button" target="_blank">
                <span class="btn-icon">🎮</span>
                <span class="btn-text">Steam Station</span>
            </a>
            
            <a href="https://soundcloud.com/linezwz" class="glass-button" target="_blank">
                <span class="btn-icon">🌌</span>
                <span class="btn-text">SoundCloud Tracks</span>
            </a>
            
       
        <!-- Кастомный минималистичный футер -->
        <footer class="minimal-footer">
            <span class="meta-dot"></span> system active
        </footer>
    </main>

</body>
</html>
